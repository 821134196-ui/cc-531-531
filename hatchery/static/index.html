<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>种蛋孵化台账</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="egg-dot"></span>
    <h1>种蛋孵化台账</h1>
  </div>
  <nav class="tabs">
    <button data-view="map" class="tab active">孵化箱盘位图</button>
    <button data-view="batches" class="tab">种蛋批次</button>
    <button data-view="incidents" class="tab">异常处置</button>
  </nav>
  <div class="userbox">
    <label>当前操作员</label>
    <select id="user-select"></select>
    <span id="user-role" class="role-chip"></span>
  </div>
</header>

<main id="view"></main>

<div id="modal-root"></div>
<div id="lightbox-root"></div>
<div id="toast-root"></div>

<script src="/app.js"></script>
</body>
</html>
